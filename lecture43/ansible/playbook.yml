- name: install Java-21 & Run SpringBoot
  hosts: myhosts
  become: true

  tasks:
   - name: install java-21-amazon-corretto-devel
     ansible.builtin.dnf:
       name: java-21-amazon-corretto-devel
       state: present

   - name: make dir
     ansible.builtin.file:
        path: /app
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

   - name: copy source code
     ansible.builtin.copy:
        src: ../demo/demo-0.0.1-SNAPSHOT.jar
        dest: /app/demo-0.0.1-SNAPSHOT.jar
        owner: ec2-user
        group: ec2-user
        mode: '0644'

   - name: create systemd service
     ansible.builtin.copy:
        dest: /etc/systemd/system/demo-0.0.1-SNAPSHOT.service
        mode: '0644'
        content: |
          [Unit]
          Description=Spring Boot Application myapp
          After=network.target

          [Service]
          User=ec2-user
          WorkingDirectory=/app
          ExecStart=/usr/bin/java -jar /app/demo-0.0.1-SNAPSHOT.jar
          SuccessExitStatus=143
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target

   - name: Reload systemd daemon
     ansible.builtin.systemd:
        daemon_reload: yes

   - name: start SprinBoot
     ansible.builtin.systemd:
        name: demo-0.0.1-SNAPSHOT
        state: started
        enabled: yes
     when: not ansible_check_mode
